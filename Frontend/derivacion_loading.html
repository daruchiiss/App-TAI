<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAI - Conectando...</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #EAE5DB; margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #mockup-phone {
            width: 375px; height: 812px; border: 14px solid #0D131A; border-radius: 45px;
            overflow: hidden; display: flex; flex-direction: column; background-color: #F7F5F0;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25); position: relative;
            padding: 60px 24px 30px 24px; box-sizing: border-box; justify-content: center; align-items: center;
        }
        #iphone-notch {
            width: 140px; height: 28px; background-color: #0D131A;
            border-bottom-left-radius: 18px; border-bottom-right-radius: 18px;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
        }
        .title {
            color: #1A3B68; font-size: 22px; font-weight: 700; text-align: center;
            line-height: 1.3; margin-bottom: 6px; padding: 0 10px;
        }
        .subtitle { color: #8A99AD; font-size: 13px; text-align: center; margin-bottom: 35px; }
        
        /* Tarjeta del Especialista asignándose */
        .specialist-card {
            background-color: #FFFDF9; border: 1px solid #F3EBD3; border-radius: 20px;
            padding: 16px 20px; width: 100%; box-sizing: border-box;
            display: flex; align-items: center; gap: 14px; margin-bottom: 30px;
        }
        .avatar-spec {
            width: 44px; height: 44px; background-color: #92B1DB; border-radius: 50%; flex-shrink: 0;
        }
        .info-spec h3 { font-size: 14px; font-weight: 700; color: #1A3B68; margin: 0 0 2px 0; }
        .info-spec p { font-size: 11px; color: #8A99AD; margin: 0; }
        .info-spec span { font-size: 11px; color: #A8A8A8; font-style: italic; }

        /* Barra de Progreso Animada */
        .progress-container { width: 100%; height: 6px; background-color: #E2E8F0; border-radius: 3px; overflow: hidden; margin-bottom: auto; }
        .progress-bar-fill {
            width: 0%; height: 100%; background-color: #1A3B68; border-radius: 3px;
            animation: load 3s linear forwards;
        }

        .btn-cancel {
            width: 100%; background-color: #FFFFFF; color: #1A3B68; border: 1px solid #E2E8F0;
            border-radius: 16px; padding: 14px; font-size: 14px; font-weight: 500;
            cursor: pointer; font-family: 'Poppins', sans-serif; text-align: center; margin-top: auto;
        }

        @keyframes load {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div id="mockup-phone">
        <div id="iphone-notch"></div>
        
        <div style="margin-top: auto; width: 100%;">
            <h1 class="title">Te estamos conectando con un profesional</h1>
            <p class="subtitle">Esto puede tomar unos segundos</p>
        </div>

        <div class="specialist-card">
            <div class="avatar-spec"></div>
            <div class="info-spec">
                <h3>Dra. Renata Solís</h3>
                <p>Psicóloga clínica</p>
                <span>Conectando...</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-bar-fill"></div>
        </div>

        <button class="btn-cancel" onclick="window.location.href='/chatbot_update'">Cancelar</button>
    </div>

    <script>
        // Redirección simulada automática al completarse la carga (3 segundos)
        setTimeout(() => {
            window.location.href = '/derivacion_exito';
        }, 3000);
    </script>
</body>
</html>
