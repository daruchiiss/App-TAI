<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAI - Acompañamiento</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif; background-color: #EAE5DB; 
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        #mockup-phone {
            width: 375px; height: 812px; border: 14px solid #0D131A; border-radius: 45px;
            overflow: hidden; display: flex; flex-direction: column; background-color: #F7F5F0;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25); position: relative; box-sizing: border-box;
        }
        #iphone-notch {
            width: 140px; height: 28px; background-color: #0D131A;
            border-bottom-left-radius: 18px; border-bottom-right-radius: 18px;
            position: absolute; top: 0; left: 50%; transform: translateX(-50%); z-index: 10;
        }
        
        /* CABECERA CON EL NUEVO LOGO */
        header {
            background-color: #FFFFFF; padding: 50px 20px 15px 20px;
            display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid #EFECE3; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .header-text { flex-grow: 1; display: flex; flex-direction: column; gap: 4px; }
        header .chat-title {
            font-size: 18px; font-weight: 700; color: #1A3B68; margin: 0;
        }

        /* --- BADGE DE ESTADO EMOCIONAL --- */
        .estado-badge {
            display: none; /* oculto hasta que haya clasificación */
            align-items: center; gap: 5px;
            font-size: 11px; font-weight: 600;
            padding: 3px 9px; border-radius: 10px;
            width: fit-content;
        }
        .estado-badge .dot {
            width: 6px; height: 6px; border-radius: 50%;
        }
        /* Semáforo emocional desaturado de TAI */
        .estado-badge.Tranquilo    { background: #E8F1EC; color: #4E7C68; display: flex; }
        .estado-badge.Tranquilo .dot    { background: #9BC9B8; }
        .estado-badge.Atencion     { background: #FBF2E4; color: #8A6A2C; display: flex; }
        .estado-badge.Atencion .dot     { background: #E3C583; }
        .estado-badge.Preocupacion { background: #F7EAE2; color: #99512E; display: flex; }
        .estado-badge.Preocupacion .dot { background: #D6976F; }
        .estado-badge.Crisis       { background: #F7E4E5; color: #8A3B41; display: flex; }
        .estado-badge.Crisis .dot       { background: #B15F63; }
        
        /* --- LOGO ESTRELLA GUÍA (FANTASMITA) --- */
        .tai-logo-container {
            position: relative; width: 38px; height: 38px;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
        }
        .tai-ghost {
            width: 34px; height: 22px; background-color: #1A3B68; border-radius: 20px 20px 0 0; 
            position: relative; display: flex; justify-content: center; gap: 6px; padding-top: 8px; box-sizing: border-box;
            clip-path: polygon(0% 0%, 100% 0%, 100% 85%, 83% 100%, 66% 85%, 50% 100%, 33% 85%, 16% 100%, 0% 85%);
            border-bottom-left-radius: 4px; border-bottom-right-radius: 4px;
        }
        .tai-eye { width: 4px; height: 4px; background-color: #FFFFFF; border-radius: 50%; }
        .tai-star {
            width: 12px; height: 12px; background-color: #F7A8B8;
            clip-path: polygon(50% 0%, 65% 35%, 100% 50%, 65% 65%, 50% 100%, 35% 65%, 0% 50%, 35% 35%);
            margin-bottom: 2px; animation: float 2s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }

        /* --- BANNER DE ESCALAMIENTO --- */
        #escalamiento-banner {
            display: none;
            margin: 16px 20px 0 20px;
            padding: 16px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.5;
        }
        #escalamiento-banner.nivel-2 {
            background: #FBF2E4;
            border: 1px solid #E3C58366;
            color: #6B5223;
        }
        #escalamiento-banner.nivel-3 {
            background: #F7E4E5;
            border: 1px solid #B15F6355;
            color: #6B2F33;
        }
        #escalamiento-banner .banner-titulo {
            font-weight: 700; margin-bottom: 6px; display: flex; gap: 6px; align-items: flex-start;
        }
        #escalamiento-banner .banner-btn {
            margin-top: 12px; width: 100%; border: none; border-radius: 10px;
            padding: 10px 14px; font-family: 'Poppins', sans-serif; font-weight: 600;
            font-size: 13px; color: #fff; cursor: pointer;
        }
        #escalamiento-banner.nivel-2 .banner-btn { background: #1A3B68; }
        #escalamiento-banner.nivel-3 .banner-btn { background: #8A3B41; }
        #escalamiento-banner .banner-btn:hover { opacity: 0.9; }

        /* CONTENEDOR DE MENSAJES */
        #chat-container {
            flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
        }
        #chat-container::-webkit-scrollbar { display: none; }
        
        .message { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .user-message {
            background-color: #1A3B68; color: white; align-self: flex-end; border-bottom-right-radius: 4px;
        }
        .tai-message {
            background-color: #FFFFFF; color: #2C3E50; align-self: flex-start; border-bottom-left-radius: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        /* ÁREA DE ENTRADA DE TEXTO */
        .input-area {
            padding: 15px 20px 30px 20px; background-color: #FFFFFF;
            display: flex; gap: 10px; align-items: center; border-top: 1px solid #EFECE3;
        }
        .input-box {
            flex-grow: 1; background-color: #F7F5F0; border: none; border-radius: 20px;
            padding: 12px 18px; font-size: 13px; outline: none; font-family: 'Poppins', sans-serif;
        }
        .btn-send {
            width: 42px; height: 42px; background-color: #1A3B68; color: white; border: none;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .btn-send:hover { background-color: #345078; }
        .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="mockup-phone">
        <div id="iphone-notch"></div>
        
        <header>
            <div class="tai-logo-container">
                <div class="tai-star"></div>
                <div class="tai-ghost">
                    <div class="tai-eye"></div>
                    <div class="tai-eye"></div>
                </div>
            </div>
            <div class="header-text">
                <h2 class="chat-title">TAI</h2>
                <div id="estado-badge" class="estado-badge">
                    <span class="dot"></span>
                    <span id="estado-badge-texto">Tranquilo</span>
                </div>
            </div>
        </header>

        <div id="escalamiento-banner">
            <div class="banner-titulo">
                <span id="banner-icono">⚠️</span>
                <span id="banner-titulo-texto"></span>
            </div>
            <div id="banner-mensaje"></div>
            <button id="banner-btn" class="banner-btn">Ver opciones de apoyo</button>
        </div>

        <div id="chat-container">
            <div class="message tai-message">Hola, soy TAI tu estrella guía. Estoy aquí para escucharte y acompañarte. ¿Cómo te encuentras hoy?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" class="input-box" placeholder="Escribe un mensaje..." autocomplete="off">
            <button id="send-btn" class="btn-send"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <script>
        // ⚙️ CONFIGURACIÓN GLOBAL DE API Y RUTAS CORREGIDA
        const BASE_URL_DETECTADA = (window.location.protocol === 'file:') 
            ? "http://127.0.0.1:5000" 
            : window.location.origin;

        const TAI_API_CONFIG = {
            BASE_URL: BASE_URL_DETECTADA,
            ENDPOINTS: {
                CHAT: "/api/chat",
                ENVIAR_REPORTE: "/api/reportes/enviar"
            },
            ESCALAMIENTO_NIVELES: {
                1: "LEVE",
                2: "MODERADO",
                3: "CRISIS"
            }
        };

        // 🧠 CLASE MANEJADORA DE REPORTES Y FLUJO DE ESCALAMIENTO
        class TAIReporteManager {
            constructor(usuarioId) {
                // 1. Intentar obtener el ID desde sesión o localStorage
                const usuarioSession = JSON.parse(sessionStorage.getItem('usuarioTAI') || '{}');
                let idGuardado = usuarioId || usuarioSession.id || localStorage.getItem("usuario_id") || localStorage.getItem("tai_anon_id");

                // 2. Si no existe ningún ID, generar uno anónimo automáticamente
                if (!idGuardado || idGuardado === "undefined" || idGuardado === "null") {
                    idGuardado = 'anon_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
                    localStorage.setItem('tai_anon_id', idGuardado);
                    console.log("👤 Asignado usuario_id anónimo fallback:", idGuardado);
                }

                this.usuarioId = idGuardado;
                localStorage.setItem("usuario_id", this.usuarioId);
                
                this.nivelActual = 1;
                this.reporteEnviado = false;
            }

            // Helper interno para procesar el usuario_id
            obtenerUsuarioIdFormateado() {
                if (!this.usuarioId) {
                    this.usuarioId = localStorage.getItem("usuario_id") || localStorage.getItem("tai_anon_id");
                }
                
                if (!this.usuarioId) {
                    console.warn("⚠️ Atención: No se encontró un usuario_id válido en la sesión.");
                    return null;
                }

                const idNumerico = Number(this.usuarioId);
                return !isNaN(idNumerico) ? idNumerico : this.usuarioId;
            }

            async enviarMensaje(mensaje) {
                try {
                    const uid = this.obtenerUsuarioIdFormateado();
                    if (!uid) {
                        throw new Error("No hay un usuario_id activo para enviar el mensaje.");
                    }

                    const respuesta = await fetch(`${TAI_API_CONFIG.BASE_URL}${TAI_API_CONFIG.ENDPOINTS.CHAT}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify({
                            mensaje: mensaje,
                            usuario_id: uid
                        })
                    });

                    const datos = await respuesta.json();

                    if (respuesta.ok) {
                        if (datos.escalamiento_activado || datos.escalamiento?.nivel_escalamiento > 1) {
                            await this.manejarEscalamiento(datos);
                        }
                        return datos;
                    } else {
                        throw new Error(datos.error || datos.mensaje || "Error en la respuesta del servidor");
                    }
                } catch (error) {
                    console.error("Error enviando mensaje:", error);
                    throw error;
                }
            }

            async manejarEscalamiento(datosChat) {
                const nivelEscalamiento = datosChat.nivel_escalamiento || 
                                         datosChat.escalamiento?.nivel_escalamiento || 
                                         (datosChat.clasificacion && datosChat.clasificacion.nivel === "Crisis" ? 3 : 2);
                
                this.nivelActual = Math.max(this.nivelActual, nivelEscalamiento);

                if (nivelEscalamiento === 3 && !this.reporteEnviado) {
                    await this.enviarReporteProfesional(datosChat);
                }
            }

            construirReporte(datosChat) {
                const uid = this.obtenerUsuarioIdFormateado();

                return {
                    usuario_id: uid,
                    tipo_alerta: (TAI_API_CONFIG.ESCALAMIENTO_NIVELES && TAI_API_CONFIG.ESCALAMIENTO_NIVELES[this.nivelActual]) || "CRISIS",
                    nivel_severidad: this.nivelActual,
                    timestamp: new Date().toISOString(),
                    datos_clinicos: {
                        score_crisis: datosChat.score_crisis || null,
                        triggers_detectados: datosChat.triggers_detectados || datosChat.clasificacion?.indicadores_clave || [],
                        cambios_de_comportamiento: datosChat.cambios_de_comportamiento || null
                    },
                    resumen_ia: datosChat.resumen_ia || datosChat.clasificacion?.justificacion || "El usuario muestra signos de crisis emocional crítica.",
                    contacto_emergencia: datosChat.contacto_emergencia || null,
                    historial_escalamientos: datosChat.historial_escalamientos || [],
                    recomendaciones: datosChat.recomendaciones || [],
                    profesional_id: "prof_001"
                };
            }

            async enviarReporteProfesional(datosChat) {
                try {
                    const payload = this.construirReporte(datosChat);
                    
                    if (!payload.usuario_id) {
                        console.error("❌ No se puede enviar el reporte: usuario_id es null o inválido.");
                        return;
                    }

                    console.log("🚨 Enviando reporte automático de crisis...", payload);

                    const respuesta = await fetch(`${TAI_API_CONFIG.BASE_URL}${TAI_API_CONFIG.ENDPOINTS.ENVIAR_REPORTE}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify(payload)
                    });

                    const resJson = await respuesta.json().catch(() => ({}));

                    if (respuesta.ok && (resJson.exito || resJson.reporte_guardado || resJson.success)) {
                        this.reporteEnviado = true;
                        console.log("✅ Reporte clínico enviado con éxito al panel del profesional.");
                    } else {
                        console.error("❌ Error enviando reporte:", resJson.error || resJson.mensaje || "Error en el servidor");
                    }
                } catch (error) {
                    console.error("❌ Fallo de red al enviar reporte:", error);
                }
            }
        }

        // 🎨 ELEMENTOS DE LA INTERFAZ
        const chatContainer = document.getElementById("chat-container");
        const userInput = document.getElementById("user-input");
        const sendBtn = document.getElementById("send-btn");
        const estadoBadge = document.getElementById("estado-badge");
        const estadoBadgeTexto = document.getElementById("estado-badge-texto");
        const banner = document.getElementById("escalamiento-banner");
        const bannerIcono = document.getElementById("banner-icono");
        const bannerTituloTexto = document.getElementById("banner-titulo-texto");
        const bannerMensaje = document.getElementById("banner-mensaje");
        const bannerBtn = document.getElementById("banner-btn");

        // Instancia global del flujo
        const userFlow = new TAIReporteManager();
        let enviando = false;

        function agregarMensaje(texto, esUsuario) {
            const elMensaje = document.createElement("div");
            elMensaje.classList.add("message");
            elMensaje.classList.add(esUsuario ? "user-message" : "tai-message");
            elMensaje.textContent = texto;
            chatContainer.appendChild(elMensaje);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function actualizarBadge(nivelTexto) {
            if (!estadoBadge || !estadoBadgeTexto) return;
            
            let claseNivel = nivelTexto;
            if (nivelTexto === "Atención" || nivelTexto === "MEDIO" || nivelTexto === "2") claseNivel = "Atencion";
            if (nivelTexto === "Preocupación") claseNivel = "Preocupacion";
            if (nivelTexto === "CRISIS" || nivelTexto === "ALTO" || nivelTexto === "3") claseNivel = "Crisis";

            estadoBadge.className = "estado-badge " + claseNivel;
            estadoBadgeTexto.textContent = claseNivel === "Atencion" ? "Atención"
                : claseNivel === "Preocupacion" ? "Preocupación"
                : claseNivel;
        }

        function mostrarBanner(nivelEscalamiento, urgencia) {
            if (!banner) return;
            banner.classList.remove("nivel-2", "nivel-3");

            if (nivelEscalamiento === 2) {
                banner.classList.add("nivel-2");
                bannerIcono.textContent = "⚠️";
                bannerTituloTexto.textContent = "Notamos que este momento es difícil para ti.";
                bannerMensaje.textContent = "Nos gustaría conectarte con un orientador capacitado" +
                    (urgencia ? ` (${urgencia}).` : ".");
                banner.style.display = "block";
            } else if (nivelEscalamiento >= 3) {
                banner.classList.add("nivel-3");
                bannerIcono.textContent = "🚨";
                bannerTituloTexto.textContent = "Notamos que este es un momento muy difícil para ti.";
                bannerMensaje.textContent = "Queremos conectarte de inmediato con alguien que pueda ayudarte.";
                banner.style.display = "block";
            }
        }

        if (bannerBtn) {
            bannerBtn.addEventListener("click", () => {
                window.location.href = "derivacion_loading.html";
            });
        }

        async function enviarMensaje() {
            const mensaje = userInput.value.trim();
            if (!mensaje || enviando) return;

            enviando = true;
            sendBtn.disabled = true;
            userInput.disabled = true;

            // 1. Dibuja INMEDIATAMENTE el mensaje del usuario
            agregarMensaje(mensaje, true);
            userInput.value = "";

            try {
                // 2. Procesa la respuesta y los reportes con la clase Manager
                const datos = await userFlow.enviarMensaje(mensaje);

                // 3. Renderiza respuesta del bot
                const respuestaTexto = datos.texto_respuesta || datos.respuesta || datos.message;
                if (respuestaTexto) {
                    agregarMensaje(respuestaTexto, false);

                    // 4. Actualización de interfaz
                    const nivelTexto = (datos.clasificacion && datos.clasificacion.nivel) || datos.severidad || "Tranquilo";
                    actualizarBadge(nivelTexto);

                    if (datos.escalamiento_activado || userFlow.nivelActual > 1) {
                        mostrarBanner(userFlow.nivelActual, datos.urgencia);
                    }
                } else {
                    agregarMensaje("Lo siento, no pude procesar adecuadamente tu mensaje.", false);
                }

            } catch (error) {
                console.error("Error en la conexión con el servidor TAI:", error);
                agregarMensaje("No se pudo conectar con el servidor. Revisa tu conexión.", false);
            } finally {
                enviando = false;
                sendBtn.disabled = false;
                userInput.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener("click", enviarMensaje);
        userInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") enviarMensaje();
        });
    </script>
</body>
</html>
