<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAI Admin - Panel de Administración</title>
    <!-- Google Fonts & Font Awesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #FAF8F5;
            color: #1A3B68;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* CONTENEDOR PRINCIPAL DIVIDIDO EN 2 SECCIONES */
        .login-wrapper {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* LADO IZQUIERDO: FORMULARIO Y MARCA */
        .left-panel {
            flex: 1.1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px 20px 20px;
            position: relative;
            z-index: 2;
        }

        /* BRANDING (LOGO Y TITULO SUPERIOR) */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background-color: #0A1C38;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #FFFFFF;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(10, 28, 56, 0.2);
        }

        .brand-title {
            font-size: 22px;
            font-weight: 700;
            color: #0A1C38;
            letter-spacing: -0.3px;
        }

        /* TARJETA DEL FORMULARIO */
        .login-card {
            background: #FFFFFF;
            width: 100%;
            max-width: 420px;
            border-radius: 24px;
            padding: 36px 32px;
            box-shadow: 0 10px 35px rgba(26, 59, 104, 0.05);
            border: 1px solid rgba(26, 59, 104, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #0A1C38;
            margin-bottom: 4px;
            text-align: center;
        }

        .card-subtitle {
            font-size: 12px;
            color: #8A857C;
            margin-bottom: 28px;
            text-align: center;
            font-weight: 400;
        }

        /* CAMPOS DE ENTRADA */
        .form-group {
            width: 100%;
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .input-label {
            font-size: 11px;
            font-weight: 700;
            color: #0A1C38;
        }

        .forgot-link {
            font-size: 11px;
            font-weight: 600;
            color: #6C7A89;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #0A1C38;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i.input-icon {
            position: absolute;
            left: 14px;
            color: #8A857C;
            font-size: 14px;
        }

        .input-box i.toggle-password {
            position: absolute;
            right: 14px;
            color: #8A857C;
            font-size: 14px;
            cursor: pointer;
        }

        .form-input {
            width: 100%;
            background-color: #F6F4EE;
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px 14px 12px 40px;
            font-size: 12.5px;
            color: #0A1C38;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input::placeholder {
            color: #B0A99F;
        }

        .form-input:focus {
            background-color: #FFFFFF;
            border-color: #0A1C38;
        }

        /* CHECKBOX */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin-bottom: 24px;
        }

        .checkbox-group input[type="checkbox"] {
            accent-color: #0A1C38;
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 11px;
            color: #6C7A89;
            cursor: pointer;
            user-select: none;
        }

        /* BOTÓN PRINCIPAL */
        .btn-submit {
            width: 100%;
            background-color: #002244;
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn-submit:hover {
            background-color: #0A1C38;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        /* BADGE DE SEGURIDAD */
        .security-badge {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px dashed #EFECE3;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            color: #79B59B;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* FOOTER DE ENLACES */
        .footer-links {
            display: flex;
            gap: 12px;
            font-size: 11px;
            color: #8A857C;
        }

        .footer-links a {
            color: #8A857C;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        /* LADO DERECHO: ILUSTRACIÓN / FOTO AMBIENTAL */
        .right-panel {
            flex: 0.9;
            background-image: linear-gradient(to right, #FAF8F5 0%, rgba(250, 248, 245, 0.1) 20%), 
                              url('https://i.pinimg.com/1200x/9a/d2/25/9ad225cb716ca593ed05c09d51b49c19.jpg');
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* RESPONSIVO PARA PANTALLAS PEQUEÑAS */
        @media (max-width: 900px) {
            .right-panel {
                display: none;
            }
            .left-panel {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        
        <!-- SECCIÓN IZQUIERDA -->
        <div class="left-panel">
            
            <!-- MARCA SUPERIOR -->
            <div class="brand-header">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <h1 class="brand-title">TAI Admin</h1>
            </div>

            <!-- CARD DE ACCESO -->
            <div class="login-card">
                <h2 class="card-title">Panel de Administración</h2>
                <p class="card-subtitle">Acceso exclusivo para personal autorizado</p>

                <form style="width: 100%;" onsubmit="event.preventDefault(); window.location.href='/Admin/dashboard.html';">
                    
                    <!-- CORREO -->
                    <div class="form-group">
                        <div class="label-row">
                            <label class="input-label">Correo electrónico institucional</label>
                        </div>
                        <div class="input-box">
                            <i class="far fa-envelope input-icon"></i>
                            <input type="email" class="form-input" placeholder="ejemplo@tai.clinic" required>
                        </div>
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="form-group">
                        <div class="label-row">
                            <label class="input-label">Contraseña</label>
                            <a href="#" class="forgot-link">Recuperar contraseña</a>
                        </div>
                        <div class="input-box">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password-input" class="form-input" placeholder="••••••••" required>
                            <i class="far fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                        </div>
                    </div>

                    <!-- RECORDAR SESIÓN -->
                    <div class="checkbox-group">
                        <input type="checkbox" id="remember">
                        <label for="remember">Recordar mi sesión por 24h</label>
                    </div>

                    <!-- BOTÓN ACCESO -->
                    <button type="submit" class="btn-submit">
                        Acceder al Sistema <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <!-- INSIGNIA DE SEGURIDAD -->
                <div class="security-badge">
                    <i class="fas fa-shield-alt"></i> CONEXIÓN CIFRADA DE GRADO CLÍNICO
                </div>
            </div>

            <!-- PIE DE PÁGINA -->
            <div class="footer-links">
                <a href="#">Soporte IT</a>
                <span>•</span>
                <a href="#">Términos de Uso</a>
                <span>•</span>
                <span>v2.4.0</span>
            </div>

        </div>

        <!-- SECCIÓN DERECHA (IMAGEN AMBIENTAL) -->
        <div class="right-panel"></div>

    </div>

    <script>
        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password-input');
            const icon = document.querySelector('.toggle-password');
            
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
